name: Security & SAST

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '0 3 * * 1' # Ejecución semanal lunes a las 03:00 UTC

jobs:
  python-security:
    name: Bandit SAST & Pip Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit -r backend/requirements.txt

      - name: Run Bandit (SAST)
        run: |
          bandit -r backend/ -ll -x backend/tests,backend/*/tests

      - name: Run Pip Audit
        run: |
          pip-audit -r backend/requirements.txt --ignore-vuln CVE-2024-XXXXX || true

  node-security:
    name: Pnpm Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Run Pnpm Audit
        working-directory: frontend
        run: |
          pnpm audit --audit-level=high || true
