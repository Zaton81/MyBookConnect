# ==============================================================================
# MyBookConnect - Configuración Nginx de Producción con Hardening
# RoadmapV3 - Sprint 2: Infraestructura y Arquitectura Web (Prioridad P0)
# ==============================================================================

# Mapeo para WebSocket Upgrade estándar
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Zonas de Rate Limiting por IP de cliente
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Upstream Balanceado para Escalabilidad Horizontal
upstream django_cluster {
    least_conn;
    server backend:8000 max_fails=3 fail_timeout=10s;
    # Réplicas adicionales cuando se escala horizontalmente (ej. backend_2, backend_3)
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    root /usr/share/nginx/html;
    index index.html;

    # Límite de tamaño de subida de archivos (imágenes, portadas, CSVs de importación)
    client_max_body_size 25M;

    # Compresión gzip de alto rendimiento
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Cabeceras globales de seguridad HTTP y Content Security Policy
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' ws: wss: https: http:; frame-src 'self' https://accounts.google.com; object-src 'none'; base-uri 'self';" always;

    # Desafío ACME Let's Encrypt / Certbot para renovación automática
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Sondas de salud públicas y de orquestador (/health/live y /health/ready)
    location /health/ {
        proxy_pass http://django_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Protección de endpoints de autenticación contra fuerza bruta
    location ~* ^/api/v1/(users/login|users/register|token)/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://django_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Proxy inverso para la API REST de Django
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://django_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Proxy inverso para Django Admin estándar
    location /admin/ {
        proxy_pass http://django_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Proxy inverso para URL de Django Admin personalizada (si aplica)
    location /panel-control-mbc/ {
        proxy_pass http://django_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Proxy inverso para WebSockets (Django Channels / Daphne)
    location /ws/ {
        proxy_pass http://django_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Archivos multimedia subidos por usuarios (volumen compartido con backend)
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        autoindex off;
    }

    # Archivos estáticos recolectados de Django (admin, rest_framework)
    location /django_static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        autoindex off;
    }

    # Caché inmutable para activos estáticos del frontend empaquetados por Vite
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Soporte para rutas de Single Page Application (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
