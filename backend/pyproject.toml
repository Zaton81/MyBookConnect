[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    "migrations",
    "venv",
    ".venv",
    "test_*.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line length handled by black/formatter
    "B008", # function call in argument defaults
]

[tool.coverage.run]
source = ["books", "users", "messages_app"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/admin.py",
    "*/apps.py",
    "*/wsgi.py",
    "*/asgi.py",
]
