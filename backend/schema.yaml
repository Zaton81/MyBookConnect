      type: string
      description: |-
        * `recommendation_shown` - Recomendación mostrada
        * `recommendation_clicked` - Recomendación clickeada
        * `book_opened` - Libro abierto
        * `wishlist_added` - Añadido a lista de deseos
        * `reading_started` - Lectura iniciada
        * `reading_finished` - Lectura finalizada
        * `rated` - Valorado
